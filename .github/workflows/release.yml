# タグ vX.Y.Z を push すると Windows でビルドし、GitHub Release に
# SnipNote-Setup-X.Y.Z.exe と SHA256SUMS.txt を添付する。
# アプリの自動更新はこの Release を参照する。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: タグとソースのバージョン一致を確認
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = (Select-String -Path snipnote.py -Pattern '^__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($src -ne $tag) { throw "snipnote.py の __version__ ($src) とタグ ($tag) が一致しません" }

      - name: ビルド (PyInstaller + Inno Setup)
        shell: pwsh
        run: .\build.ps1

      - name: 動作確認 (--version)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SnipNote\SnipNote.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "SnipNote.exe --version failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: SnipNote-installer
          path: |
            dist/SnipNote-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Release 作成
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SnipNote-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
