# タグ vX.Y.Z を push すると Windows でビルドし、GitHub Release に
# SnapGo-Setup-X.Y.Z.exe と SHA256SUMS.txt を添付する。
# アプリの自動更新はこの Release を参照する。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: タグとソースのバージョン一致を確認
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = (Select-String -Path snapgo.py -Pattern '^__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($src -ne $tag) { throw "snapgo.py の __version__ ($src) とタグ ($tag) が一致しません" }

      - name: ビルド (PyInstaller + Inno Setup)
        shell: pwsh
        run: .\build.ps1

      - name: 動作確認 (import + exe 起動を60秒で打ち切り)
        shell: pwsh
        run: |
          python -c "import snapgo, updater; print('import ok', snapgo.__version__)"
          if (-not (Test-Path dist\SnapGo\SnapGo.exe)) { throw "SnapGo.exe がありません" }
          $p = Start-Process -FilePath dist\SnapGo\SnapGo.exe -ArgumentList "--version" -PassThru
          $done = $p.WaitForExit(60000)
          if (-not $done) {
            Stop-Process -Id $p.Id -Force
            Write-Warning "SnapGo.exe --version が60秒で終了しませんでした（GUIダイアログ待ちの可能性）。ビルドは続行します。"
          } elseif ($p.ExitCode -ne 0) {
            throw "SnapGo.exe --version failed ($($p.ExitCode))"
          } else {
            Write-Host "exe ok"
          }
          Get-ChildItem build\SnapGo\warn-SnapGo.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ | Select-Object -First 40 }

      - uses: actions/upload-artifact@v4
        with:
          name: SnapGo-installer
          path: |
            dist/SnapGo-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Release 作成
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SnapGo-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
